<section role="alert" data-testid="similarity-warning">
  <h2>Similar title warning</h2>
  <p>A title with the same normalized title and year exists under another provider. The identities will remain separate.</p>
  <form action="/ui/metadata/confirm" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="selection_token" value="{{ selection_token }}">
    <input type="hidden" name="confirm_similar" value="yes">
    <button type="submit">Add as a separate identity</button>
  </form>
</section>
