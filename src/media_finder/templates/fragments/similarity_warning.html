<section role="alert" data-testid="similarity-warning">
  <h2>{{ _('Similar title warning') }}</h2>
  <p>{{ _('A title with the same normalized title and year exists under another provider. The identities will remain separate.') }}</p>
  <form action="/ui/metadata/confirm" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="selection_token" value="{{ selection_token }}">
    <input type="hidden" name="confirm_similar" value="yes">
    <button type="submit">{{ _('Add as a separate identity') }}</button>
  </form>
</section>
