<section aria-live="polite"><h3>{{ _('Ephemeral release results') }}</h3>
{% for result in results %}<article data-testid="release-result"><label><input type="radio" name="release_token" form="acquisition-form" value="{{ result.token }}" required> {{ result.title }} · {{ result.indexer }}</label></article>
{% else %}<p role="status">{{ _('No torrent results.') }}</p>{% endfor %}</section>
