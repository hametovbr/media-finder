{% for provider, entries in grouped.items() %}
<section data-testid="provider-results-{{ provider }}" aria-labelledby="provider-{{ provider }}">
  <h3 id="provider-{{ provider }}">{{ provider }}</h3>
  {% for entry in entries %}
  <form action="/ui/metadata/confirm" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="selection_token" data-testid="provider-result-token" value="{{ entry.token }}">
    <p>{{ entry.result.title }}{% if entry.result.year %} · {{ entry.result.year }}{% endif %} · {{ kind_label(entry.result.kind.value) }}</p>
    <button type="submit">{{ _('Select and confirm') }}</button>
  </form>
  {% endfor %}
</section>
{% else %}<p role="status">{{ _('No metadata results.') }}</p>{% endfor %}
