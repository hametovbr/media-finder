{% extends "base.html" %}
{% block content %}<h2>{{ _('Find release') }}</h2>
<form hx-post="/ui/items/{{ item_id }}/releases/search" hx-target="#release-results">
  <input type="hidden" name="csrf" value="{{ csrf }}"><fieldset><legend>{{ _('Prowlarr torrent search') }}</legend>
  <label>{{ _('Free query') }} <input name="query" required></label><label>{{ _('Indexer filter') }} <input name="indexer"></label><button>{{ _('Search torrents') }}</button></fieldset>
</form><div id="release-results" aria-live="polite"></div>
<form id="acquisition-form" action="/ui/items/{{ item_id }}/acquisitions" method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">
  <label>{{ _('Download client') }} <select name="client_instance_id" data-testid="client-select" hx-post="/ui/clients/{{ clients[0].id if clients else '' }}/destinations" hx-target="#destination-container">{% for client in clients %}<option value="{{ client.id }}">{{ client.name }}</option>{% endfor %}</select></label>
  <div id="destination-container"></div><button data-testid="submit-acquisition">{{ _('Create acquisition') }}</button>
</form>{% endblock %}
