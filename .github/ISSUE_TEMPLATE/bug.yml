name: Bug report
description: Report a reproducible problem without including secrets or private media data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include tokens, passkeys, torrent artifacts, private URLs, or database contents.
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the immutable image tag or commit.
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [linux/amd64, linux/arm64, source checkout]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest safe steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted logs and request IDs when useful.
    validations:
      required: true
