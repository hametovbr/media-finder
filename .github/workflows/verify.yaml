name: Reusable verification

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.tools/uv-cache

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked documentation tooling
        run: pnpm install --frozen-lockfile
      - name: Enforce English repository documentation
        run: pnpm docs:check
      - name: Validate OpenSpec strictly
        run: pnpm spec:validate
      - name: Validate delivery policy mutations
        run: pnpm delivery:test
      - name: Validate delivery artifacts
        run: pnpm delivery:validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked Python workspace
        run: uv sync --frozen --all-groups
      - name: Install locked asset tooling
        run: pnpm install --frozen-lockfile
      - name: Check built-in UI formatting
        run: pnpm ui:format
      - name: Lint built-in UI
        run: pnpm ui:lint
      - name: Test built-in UI
        run: pnpm ui:test
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Type-check all distributions
        run: uv run mypy
      - name: Build frontend production assets
        run: pnpm ui:build
      - name: Build independent workspace wheels
        run: |
          uv build --wheel --package media-finder --out-dir dist/wheels
          uv build --wheel --package media-finder-core --out-dir dist/wheels
          uv build --wheel --package media-finder-module-sdk --out-dir dist/wheels
          uv build --wheel --package media-finder-control-contracts --out-dir dist/wheels
          uv build --wheel --package media-finder-builtin-ui --out-dir dist/wheels
          uv build --wheel --package media-finder-metadata-manual --out-dir dist/wheels
          uv build --wheel --package media-finder-metadata-tmdb --out-dir dist/wheels
          uv build --wheel --package media-finder-release-prowlarr --out-dir dist/wheels
          uv build --wheel --package media-finder-download-qbittorrent --out-dir dist/wheels
      - name: Verify wheel isolation and package architecture
        run: >-
          uv run pytest
          tests/test_wheel_isolation.py
          tests/test_workspace_packages.py
          tests/architecture/test_package_boundaries.py
          tests/architecture/test_legacy_root_removal.py
      - name: Rebuild static assets
        run: pnpm ui:build
      - name: Reject generated asset drift
        run: git diff --exit-code -- packages/builtin-ui/src/media_finder_builtin_ui/static

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked Python workspace
        run: uv sync --frozen --all-groups
      - name: Isolated built-in UI unit tests
        run: uv run python packages/builtin-ui/tests/run_isolated.py unit
      - name: Core and unit suites
        run: >-
          uv run pytest
          tests/core
          tests/test_architecture_documentation.py
          tests/test_control_contracts.py
          tests/test_documentation_language.py
          tests/test_ephemeral_cache.py
          tests/test_manual.py
          tests/test_naming.py
          tests/test_nfo.py
          tests/test_prowlarr.py
          tests/test_verify_image.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked Python workspace
        run: uv sync --frozen --all-groups
      - name: Server and integration suites
        run: >-
          uv run pytest
          tests/server
          tests/test_api_foundation.py
          tests/test_control_gateway_acquisition.py
          tests/test_control_gateway_catalog.py
          tests/test_control_gateway_contract.py
          tests/test_control_gateway_diagnostics.py
          tests/test_control_gateway_manual.py
          tests/test_control_gateway_metadata.py
          tests/test_control_security.py
          tests/test_domain.py
          tests/test_metadata_api.py
          tests/test_runtime.py
          tests/test_runtime_logging.py
          tests/test_runtime_ui_mode.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked contract tooling
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --all-groups
      - name: Architecture rules and public characterization
        run: >-
          uv run pytest tests/architecture tests/characterization
          tests/test_project_skills.py
      - name: Module SDK contracts
        run: uv run pytest --no-cov packages/module-sdk/tests
      - name: Manifest and SDK schema drift
        run: >-
          uv run pytest --no-cov
          packages/module-sdk/tests/test_manifest.py
          packages/module-sdk/tests/test_schema_artifacts.py
      - name: Metadata provider conformance
        run: >-
          uv run pytest --no-cov
          packages/modules/metadata-manual/tests
          packages/modules/metadata-tmdb/tests
          tests/test_tmdb_retention.py
      - name: Release provider conformance
        run: uv run pytest --no-cov packages/modules/release-prowlarr/tests
      - name: Download client conformance
        run: uv run pytest --no-cov packages/modules/download-qbittorrent/tests
      - name: Serialized module fixture drift
        run: |
          pnpm module-conformance:test
          pnpm module-conformance:validate
      - name: Control and processor OpenAPI drift
        run: uv run pytest tests/test_control_openapi.py tests/test_processor_openapi.py
      - name: Clean migration and schema drift
        run: >-
          uv run python scripts/check_schema_drift.py &&
          uv run pytest --no-cov tests/test_db.py tests/architecture/test_clean_core_schema.py
      - name: Browser control and processor contracts
        run: >-
          uv run pytest
          tests/test_control_api_acquisition.py
          tests/test_control_api_catalog.py
          tests/test_control_api_metadata.py
          tests/test_control_api_security.py
          tests/test_control_conformance_real.py
          tests/test_module_registry_composition.py
          tests/test_module_runtime_transport_hardening.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked frontend workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @media-finder/builtin-ui exec playwright install --with-deps chromium
      - name: Built-in UI browser tests
        run: pnpm ui:browser

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: media-finder:ci
      - name: Exercise production image
        run: bash scripts/smoke-container.sh
