name: Reusable verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm spec:validate
      - run: pnpm delivery:test
      - run: pnpm delivery:validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Build independent workspace wheels
        run: |
          uv build --wheel --package media-finder-control-contracts --out-dir dist/control-contracts
          uv build --wheel --package media-finder-builtin-ui --out-dir dist/builtin-ui
          uv build --wheel --package media-finder --out-dir dist/backend
      - run: pnpm assets:build
      - run: git diff --exit-code -- packages/builtin-ui/src/media_finder_builtin_ui/static

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Isolated built-in UI unit tests
        run: uv run python packages/builtin-ui/tests/run_isolated.py unit
      - name: Unit tests
        run: >-
          uv run pytest
          tests/test_config.py
          tests/test_documentation_language.py
          tests/test_ephemeral_cache.py
          tests/test_manual.py
          tests/test_naming.py
          tests/test_nfo.py
          tests/test_prowlarr.py
          tests/test_control_contracts.py
          tests/test_workspace_packages.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Integration tests
        run: >-
          uv run pytest
          tests/test_acquisition.py
          tests/test_api_foundation.py
          tests/test_db.py
          tests/test_domain.py
          tests/test_metadata_api.py
          tests/test_runtime.py
          tests/test_runtime_ui_mode.py
          tests/test_system_download_client.py
          tests/test_control_gateway_acquisition.py
          tests/test_control_gateway_catalog.py
          tests/test_control_gateway_contract.py
          tests/test_control_gateway_diagnostics.py
          tests/test_control_gateway_manual.py
          tests/test_control_gateway_metadata.py
          tests/test_control_security.py
          tests/test_ui_catalog.py
          tests/test_ui_error_feedback.py
          tests/test_ui_foundation.py
          tests/test_ui_i18n.py
          tests/test_ui_manual_structured.py
          tests/test_ui_release_live_clients.py
          tests/test_ui_release_acceptance.py
          tests/test_ui_runtime_settings.py
          tests/test_ui_semantic_feedback.py
          tests/test_ui_settings.py
          tests/test_ui_workflows.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - name: Serialized module conformance
        run: |
          pnpm module-conformance:test
          pnpm module-conformance:validate
      - name: Module contract tests
        run: >-
          uv run pytest
          tests/test_tmdb_retention.py
          tests/test_control_api_acquisition.py
          tests/test_control_api_catalog.py
          tests/test_control_api_metadata.py
          tests/test_control_api_security.py
          tests/test_control_conformance_real.py
          tests/test_control_openapi.py
          tests/test_processor_openapi.py
          tests/test_module_registry_composition.py
          tests/test_module_runtime_transport_hardening.py
          tests/test_wheel_isolation.py
          tests/architecture
          packages/module-sdk/tests
          packages/modules/metadata-manual/tests
          packages/modules/metadata-tmdb/tests
          packages/modules/release-prowlarr/tests
          packages/modules/download-qbittorrent/tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run playwright install --with-deps chromium
      - name: Isolated built-in UI browser tests
        run: uv run python packages/builtin-ui/tests/run_isolated.py browser
      - run: uv run pytest tests/test_ui_browser.py

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: media-finder:ci
      - name: Exercise production image
        run: bash scripts/smoke-container.sh
