name: Publish stable container

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Serialize every stable publication, including releases published by hand.
  group: stable-container-publication
  cancel-in-progress: false

jobs:
  verification:
    if: ${{ github.event.release.prerelease == false }}
    uses: ./.github/workflows/verify.yaml
    permissions:
      contents: read

  publish:
    if: ${{ github.event.release.prerelease == false }}
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify stable image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          PUBLICATION_EVIDENCE_PATH: release-publication-evidence.json
        run: node scripts/release-publication.mjs
      - name: Upload stable publication evidence
        if: ${{ always() && hashFiles('release-publication-evidence.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-publication-evidence.json
          if-no-files-found: error
          retention-days: 90
