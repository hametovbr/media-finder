[project]
name = "media-finder-metadata-tmdb"
version = "0.2.0"
description = "TMDB metadata provider module for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "media-finder-module-sdk",
  "pydantic>=2.11,<3",
  "python-dateutil>=2.9,<3",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_metadata_tmdb"]
