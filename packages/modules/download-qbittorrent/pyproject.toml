[project]
name = "media-finder-download-qbittorrent"
version = "0.2.0"
description = "qBittorrent download client module for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1",
  "media-finder-module-sdk",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_download_qbittorrent"]
