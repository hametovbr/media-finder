[project]
name = "media-finder-builtin-ui"
version = "0.1.0"
description = "Built-in Jinja and HTMX interface for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "babel>=2.17,<3",
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "media-finder-control-contracts",
  "uvicorn>=0.35,<1",
]

[project.scripts]
media-finder-ui-dev = "media_finder_builtin_ui.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_builtin_ui"]
