[project]
name = "media-finder-builtin-ui"
version = "0.2.0"
description = "Bundled static web interface for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "media-finder-control-contracts",
]

[dependency-groups]
test = [
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_builtin_ui"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
]
