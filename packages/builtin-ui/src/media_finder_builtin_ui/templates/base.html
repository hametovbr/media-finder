<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Media Finder{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/ui.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ _('Skip to content') }}</a>
  <div class="shell">
    <aside>
      <h1>Media Finder</h1>
      <nav aria-label="{{ _('Collections') }}">
        <a href="/">{{ _('All titles') }}</a>
        <a href="/?collection=uncategorized">{{ _('Uncategorized') }}</a>
        {% for collection in collections %}
          <div class="collection-link"><a href="/?collection={{ collection.id }}">{{ collection.name }}</a>
          <form action="/ui/collections/{{ collection.id }}/archive" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit" aria-label="{{ _('Archive collection') }}: {{ collection.name }}">×</button></form></div>
        {% endfor %}
        <a href="/?archived=1">{{ _('Archive') }}</a>
      </nav>
      <form action="/ui/collections" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ _('New collection') }} <input name="name" required></label><button type="submit">{{ _('Create collection') }}</button></form>
      <nav class="utility" aria-label="{{ _('Utilities') }}">
        <a href="/add">{{ _('Add title') }}</a>
        <a href="/settings">{{ _('Settings') }}</a>
        <a href="/about">{{ _('About') }}</a>
      </nav>
    </aside>
    <main id="main" tabindex="-1">
      <header class="page-header">
        <form action="/ui/locale" method="post">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <label>{{ _('Language') }}
            <select name="locale" data-testid="locale-switcher" onchange="this.form.submit()">
              <option value="en"{% if locale == 'en' %} selected{% endif %}>{{ _('English') }}</option>
              <option value="ru"{% if locale == 'ru' %} selected{% endif %}>{{ _('Russian') }}</option>
            </select>
          </label>
        </form>
        <form action="/ui/metadata-locale" method="post">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <label>{{ _('Metadata locale') }}
            <select name="metadata_locale" data-testid="metadata-locale-switcher" onchange="this.form.submit()">
              <option value="en"{% if metadata_locale == 'en' %} selected{% endif %}>{{ _('English') }}</option>
              <option value="ru"{% if metadata_locale == 'ru' %} selected{% endif %}>{{ _('Russian') }}</option>
            </select>
          </label>
        </form>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
