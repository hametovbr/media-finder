{% extends "base.html" %}
{% block title %}{{ _('Add title') }} · Media Finder{% endblock %}
{% block content %}
<h2>{{ _('Add title') }}</h2>
<form hx-post="/ui/metadata/search" hx-target="#provider-results">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <fieldset><legend>{{ _('Search metadata providers') }}</legend>
    <label>{{ _('Query') }} <input name="query" required></label>
    <input type="hidden" name="metadata_locale" value="{{ metadata_locale }}">
    <p>{{ _('Metadata locale') }}: <strong>{{ metadata_locale }}</strong></p>
    <button type="submit">{{ _('Search') }}</button>
  </fieldset>
</form>
<div id="provider-results" aria-live="polite"></div>
<p><a href="/add/manual" data-testid="add-mode-manual">{{ _('Create manually') }}</a></p>
{% endblock %}
