{% if error_code %}<p role="alert" aria-live="assertive" data-error-code="{{ error_code }}">{{ error_label(error_code) }} <code>{{ error_code }}</code></p>{% endif %}
<label>{{ _('Live destination') }} <select name="destination" data-testid="destination-select">{% for destination in destinations %}<option value="{{ destination.key }}">{{ destination.label }}</option>{% endfor %}</select></label>
