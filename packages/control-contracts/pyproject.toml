[project]
name = "media-finder-control-contracts"
version = "0.2.0"
description = "Framework-independent browser control contracts for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_control"]
