[project]
name = "media-finder-module-sdk"
version = "0.1.0"
description = "Public module contracts for Media Finder extensions"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "packaging>=24,<26",
  "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_sdk"]
