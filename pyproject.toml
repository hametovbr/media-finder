[dependency-groups]
dev = [
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "media-finder",
  "mypy>=1.17,<2",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-python-dateutil>=2.9,<3",
  "uv==0.12.5",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*", "packages/modules/*"]
exclude = ["packages/modules"]

[tool.uv.sources]
media-finder = { workspace = true }
media-finder-core = { workspace = true }
media-finder-module-sdk = { workspace = true }
media-finder-control-contracts = { workspace = true }
media-finder-builtin-ui = { workspace = true }
media-finder-metadata-manual = { workspace = true }
media-finder-metadata-tmdb = { workspace = true }
media-finder-release-prowlarr = { workspace = true }
media-finder-download-qbittorrent = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = [
  "media_finder",
  "media_finder_server",
  "media_finder_core",
  "media_finder_sdk",
  "media_finder_control",
  "media_finder_builtin_ui",
  "media_finder_metadata_manual",
  "media_finder_metadata_tmdb",
  "media_finder_release_prowlarr",
  "media_finder_download_qbittorrent",
]
mypy_path = [
  "apps/server/src",
  "packages/core/src",
  "packages/module-sdk/src",
  "packages/control-contracts/src",
  "packages/builtin-ui/src",
  "packages/modules/metadata-manual/src",
  "packages/modules/metadata-tmdb/src",
  "packages/modules/release-prowlarr/src",
  "packages/modules/download-qbittorrent/src",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=media_finder --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = []
# Starlette 1.x still falls back to httpx while its test client migrates to the
# separately distributed httpx2 package. Keep that single import-time boundary
# tolerated while promoting every other warning to an error.
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
]

[tool.coverage.run]
branch = true
