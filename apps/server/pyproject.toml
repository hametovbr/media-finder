[project]
name = "media-finder"
version = "0.3.0"
description = "Production composition host for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "media-finder-builtin-ui",
  "media-finder-control-contracts",
  "media-finder-core",
  "media-finder-module-sdk",
  "media-finder-metadata-manual",
  "media-finder-metadata-tmdb",
  "media-finder-release-prowlarr",
  "media-finder-download-qbittorrent",
  "pydantic-settings>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_server"]
