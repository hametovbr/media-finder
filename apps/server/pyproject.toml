[project]
name = "media-finder"
version = "0.1.0"
description = "Production composition host for Media Finder"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "media-finder-builtin-ui",
  "media-finder-control-contracts",
  "media-finder-core",
  "media-finder-metadata-manual",
  "media-finder-metadata-tmdb",
  "media-finder-release-prowlarr",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_finder_server"]
